<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Pokemon Center Lottery Bot</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <div class="header">
            <img src="icon.png" alt="icon" class="logo">
            <div class="header-text">
                <h3>Pokemon Center</h3>
                <span>Auto Lottery Bot v1.0</span>
            </div>
        </div>

        <div class="content">
            <div class="desc">
                Tự động quét & nộp đơn bốc thăm (抽選販売) các sản phẩm thẻ bài Pokémon ngay sau khi đăng nhập.
            </div>

            <div class="actions">
                <button id="btn-open-page" class="btn btn-secondary">
                    🌐 Mở trang Xổ số Pokémon
                </button>
                <button id="btn-run-now" class="btn btn-primary">
                    ⚡ Kích hoạt Quét & Đăng ký
                </button>
            </div>

            <div id="status-msg" class="status-msg"></div>
        </div>

        <div class="footer">
            <span>Đã tối ưu hóa bảo mật & chống bot WAF</span>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
